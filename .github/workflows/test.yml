
name: Test Project

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: DevOpsProject
      ENVIRONMENT: test

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Check test file
        run: test -f test.txt

      - name: Check file content
        run: grep "Devops Git project" test.txt

      - name: Show environment
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Build project
        run: echo "Building project..."

      - name: Show file
        run: cat test.txt
